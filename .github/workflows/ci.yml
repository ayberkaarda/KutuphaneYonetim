name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    env:
      KUTUPHANE_SKIP_SQL_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: dotnet publish src/KutuphaneYonetim.UI -c Release -r win-x64 --self-contained false -o publish
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md, README.tr.md, CHANGELOG.md, CHANGELOG.tr.md publish/
          Compress-Archive -Path publish/* -DestinationPath "KutuphaneYonetim-${{ github.ref_name }}-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: KutuphaneYonetim-${{ github.ref_name }}-win-x64
          path: KutuphaneYonetim-${{ github.ref_name }}-win-x64.zip
          if-no-files-found: error
